# ShipProof classifier corpus (§9).
# Each entry is a real-world-shaped failure message labelled by an automation engineer with the
# category a human would assign during morning triage. `rule` is the rule we expect to fire; it is
# checked only when present. Categories: product | maintenance | environment | unclassified.
# The test suite fails if overall category accuracy drops below 90%.

